<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahava — Pronto tu espacio para pedir tus panes</title>
  <meta name="description" content="Panes artesanales hechos con amor. Pronto abrimos para ti.">
  <meta name="theme-color" content="#6c7555">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .carousel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
      animation: fadeInOut 20s ease-in-out infinite;
    }

    .slide:nth-child(1) { animation-delay: 0s; }
    .slide:nth-child(2) { animation-delay: 4s; }
    .slide:nth-child(3) { animation-delay: 8s; }
    .slide:nth-child(4) { animation-delay: 12s; }
    .slide:nth-child(5) { animation-delay: 16s; }

    @keyframes fadeInOut {
      0%, 20% { opacity: 0; }
      25%, 75% { opacity: 1; }
      80%, 100% { opacity: 0; }
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Overlay oscuro para mejorar legibilidad del texto */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 2;
    }

    .content {
      position: relative;
      z-index: 3;
      text-align: center;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      max-width: 90%;
    }

    .logo {
      width: clamp(80px, 12vw, 140px);
      height: auto;
      filter: brightness(0) invert(1);
      animation: fadeIn 1.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message {
      font-size: clamp(1.5rem, 5vw, 3rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.2;
      max-width: 600px;
      animation: fadeIn 1.5s ease-out 0.2s backwards;
    }

    .contact {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      animation: fadeIn 1.5s ease-out 0.4s backwards;
    }

    .contact a {
      color: white;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .contact a:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-2px);
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .email-link {
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 0.9em;
      letter-spacing: 0.02em;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .content {
        gap: 2rem;
      }

      .message {
        font-weight: 300;
      }

      .contact {
        gap: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="carousel">
      <div class="slide">
        <img src="assets/images/Slide-01.webp" alt="Pan artesanal">
      </div>
      <div class="slide">
        <img src="assets/images/Slide-02.webp" alt="Pan artesanal">
      </div>
      <div class="slide">
        <img src="assets/images/Slide-03.webp" alt="Pan artesanal">
      </div>
      <div class="slide">
        <img src="assets/images/Slide-04.webp" alt="Pan artesanal">
      </div>
      <div class="slide">
        <img src="assets/images/Slide-05.webp" alt="Pan artesanal">
      </div>
    </div>

    <div class="overlay"></div>

    <div class="content">
      <svg class="logo" viewBox="0 0 96 35" xmlns="http://www.w3.org/2000/svg">
        <text x="48" y="25" font-family="Georgia, serif" font-size="32" font-weight="bold" text-anchor="middle" fill="white">Ahava</text>
      </svg>

      <h1 class="message">Pronto tu espacio para pedir tus panes</h1>

      <div class="contact">
        <a href="mailto:cam.sepulvedao@gmail.com" class="email-link">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 8l9 6 9-6M3 8v8c0 1.1.9 2 2 2h14a2 2 0 002-2V8"/>
          </svg>
          cam.sepulvedao@gmail.com
        </a>

        <a href="https://instagram.com/ahava.sabor" target="_blank" rel="noopener noreferrer">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor"/>
          </svg>
          @ahava.sabor
        </a>
      </div>
    </div>
  </section>
</body>
</html>
