  <!-- Helvena va auto-alojada y recortada a los caracteres que la página
       usa: 9 KB por peso. Sin Google Fonts, la página no pide nada a
       terceros y el titular no parpadea al cargar. -->
  <link rel="preload" href="assets/fonts/Helvena-Medium.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face {
      font-family: 'Helvena';
      src: url('assets/fonts/Helvena-Regular.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Helvena';
      src: url('assets/fonts/Helvena-Medium.woff2') format('woff2');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Helvena';
      src: url('assets/fonts/Helvena-Bold.woff2') format('woff2');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    /* ---------------------------------------------------------------
       Ahava — página de espera

       Composición de cartel: logotipo arriba a la izquierda, titular
       grande abajo, y las tres barras de la casa como sello. El velo
       cae en diagonal — denso donde vive el texto, abierto arriba a la
       derecha para que la fotografía respire.
       --------------------------------------------------------------- */
    :root {
      --cream:      #F8F3EC;   /* el blanco del propio logotipo */
      --damasco:    #F15639;
      --olive-deep: #5C6448;
      --ink:        #1F2118;

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Helvena', system-ui, -apple-system, 'Segoe UI', sans-serif;
      /* Olivo profundo detrás: si una foto tarda, el fondo sigue siendo
         de la marca y no un rectángulo negro. */
      background: var(--olive-deep);
      color: var(--cream);
      min-height: 100svh;
    }

    /* --- Escenario ------------------------------------------------- */

    .stage {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
    }

    .backdrop { position: absolute; inset: 0; z-index: -2; }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      animation: crossfade 30s linear infinite;
    }
    /* Todos los retardos corridos -1,2s: así la primera foto ya está a
       plena opacidad al cargar, en vez de subir desde el fondo verde. */
    .slide:nth-child(1) { animation-delay: -1.2s; }
    .slide:nth-child(2) { animation-delay:  4.8s; }
    .slide:nth-child(3) { animation-delay: 10.8s; }
    .slide:nth-child(4) { animation-delay: 16.8s; }
    .slide:nth-child(5) { animation-delay: 22.8s; }

    .slide img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      animation: drift 30s linear infinite;
      animation-delay: inherit;
    }

    /* Cinco fotos, 30s de ciclo: 6s cada una con 1,2s de cruce.
       El reencuadre vuelve a cero mientras la foto está invisible. */
    @keyframes crossfade {
      0%   { opacity: 0; }
      4%   { opacity: 1; }
      20%  { opacity: 1; }
      24%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes drift {
      0%   { transform: scale(1.02); }
      24%  { transform: scale(1.09); }
      100% { transform: scale(1.09); }
    }

    /* --- Retícula del cartel ---------------------------------------- */

    /* Margen único de 20px contra el viewport: el cartel va a sangre y
       las tres esquinas ocupadas comparten la misma calle. */
    .frame {
      position: relative;
      min-height: 100svh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(2rem, 6vw, 4rem);
      animation: settle 1s var(--ease-out) both;
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .brand {
      width: clamp(122px, 15vw, 178px);
      height: auto;
      display: block;
      margin-top: 20px;
      /* Sombra muy abierta: no se lee como sombra, solo despega la
         pieza cuando la foto de turno es clara. Ahora es la única
         defensa de contraste del logo — ya no hay velo detrás. */
      filter: drop-shadow(0 2px 16px rgba(31, 33, 24, 0.6));
    }

    /* --- Titular ----------------------------------------------------
       Cuatro líneas marcadas a mano, como en el mockup. El cuerpo se
       calcula sobre el ancho del viewport, así que el bloque crece y
       encoge con la pantalla sin volver a quebrarse.
       nowrap: los <br> ya deciden dónde corta cada línea; nowrap evita
       que además se parta sola por falta de espacio, que es justo el
       reflow que arruinaría el corte de cuatro líneas al agrandar el
       cuerpo en escritorio.
       Sin velo ni trazo detrás, la única defensa de contraste es este
       halo: una sombra difusa, sin borde duro. Es más débil que un
       contorno — en las zonas más claras de cada foto el texto pierde
       un poco de lectura —, pero es lo que se pidió. */
    h1 {
      font-weight: 500;               /* Helvena Medium */
      font-size: clamp(2.75rem, 10vw, 7.5rem);
      line-height: 0.98;
      letter-spacing: -0.03em;
      white-space: nowrap;
      color: var(--cream);
      text-shadow: 0 4px 30px rgba(31, 33, 24, 0.65), 0 1px 4px rgba(31, 33, 24, 0.5);
    }

    .foot {
      display: flex;
      flex-direction: column;
      gap: clamp(1.5rem, 4vw, 2.25rem);
    }

    /* --- Acciones ---------------------------------------------------
       Las tres tintas de la casa, cada franja un botón. Sin bordes ni
       esquinas redondeadas: leen como una carta de color impresa, no
       como controles de una aplicación. */
    .actions {
      display: grid;
      gap: 5px;
      width: clamp(232px, 28vw, 330px);
      flex: none;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-height: 56px;
      padding: 0.9rem clamp(1rem, 2vw, 1.4rem);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      /* Versalitas espaciadas: el mismo recurso que ya usa el logotipo
         en "AMOR HECHO SABOR". */
      text-transform: uppercase;
      letter-spacing: 0.085em;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 14px -4px rgba(31, 33, 24, 0.55);
      transition: filter 180ms var(--ease-out);
    }

    .btn .icon {
      width: 20px; height: 20px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 180ms var(--ease-out);
    }
    .btn .icon .solid { fill: currentColor; stroke: none; }

    /* Orden del mockup: olivo, damasco, crema. El correo cierra abajo
       por ser la vía secundaria. */
    .btn-whatsapp  { background: var(--olive-deep); color: var(--cream); }  /* 5.64:1 */
    .btn-instagram { background: var(--damasco);    color: var(--ink);   }  /* 4.76:1 */
    /* No muestra la dirección: el botón dice qué hace. */
    .btn-mail      { background: var(--cream);      color: var(--ink);   }  /* 14.8:1 */

    /* Al pasar por encima la franja se aclara y el icono avanza. Se
       mueve el icono con transform y no el relleno del botón: animar
       padding obliga a recalcular la maqueta en cada fotograma. */
    .btn:hover { filter: brightness(1.08); }
    .btn:hover .icon { transform: translateX(4px); }
    .btn:active { filter: brightness(0.94); }

    .btn:focus-visible { outline: 3px solid var(--cream); outline-offset: -3px; }

    /* A partir de aquí el titular y los botones caben lado a lado: fila
       en vez de columna, texto pegado a la izquierda y botones a la
       derecha, ambos alineados por su base. El padding de 20px en
       .frame ya pone las dos piezas contra el viewport — no hace falta
       posicionarlas a mano. */
    @media (min-width: 800px) {
      .foot {
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between;
        gap: clamp(2rem, 5vw, 4rem);
      }
    }

    /* En vertical van apilados y el bloque ocupa el ancho completo. */
    @media (max-width: 799px) {
      h1 { white-space: normal; }   /* en móvil el corte ya lo da el ancho */
      .actions { width: 100%; }
    }

    /* Pantallas bajas (móvil en horizontal): que el cartel pueda
       desplazarse en vez de quedar cortado. */
    @media (max-height: 560px) {
      .frame { min-height: auto; padding-block: 2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      /* Se detiene en la primera foto y el cartel ya está puesto.
         No se pierde información: las cinco fotos son de lo mismo. */
      .slide, .slide img, .frame { animation: none; }
      .slide:nth-child(1) { opacity: 1; }
      .btn { transition-duration: 1ms; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>

</body>
