<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#E8DCC8"/>

  <!-- Pattern background -->
  <defs>
    <pattern id="cami-pattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect x="8" y="8" width="22" height="22" fill="none" stroke="#f79969" stroke-width="1" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#cami-pattern)"/>

  <!-- Head -->
  <circle cx="200" cy="120" r="50" fill="#f79969" opacity="0.4"/>

  <!-- Body -->
  <rect x="150" y="170" width="100" height="120" fill="#f79969" opacity="0.3"/>

  <!-- Arms -->
  <ellipse cx="130" cy="210" rx="20" ry="45" fill="#f79969" opacity="0.25" transform="rotate(-30 130 210)"/>
  <ellipse cx="270" cy="210" rx="20" ry="45" fill="#f79969" opacity="0.25" transform="rotate(30 270 210)"/>

  <!-- Smile -->
  <path d="M 190 130 Q 200 140 210 130" stroke="#9B9B79" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Eyes -->
  <circle cx="185" cy="115" r="3" fill="#9B9B79" opacity="0.6"/>
  <circle cx="215" cy="115" r="3" fill="#9B9B79" opacity="0.6"/>

  <!-- Apron detail -->
  <rect x="160" y="200" width="80" height="60" fill="none" stroke="#9B9B79" stroke-width="1.5" opacity="0.4"/>

  <!-- Text -->
  <text x="200" y="360" font-size="18" font-weight="bold" text-anchor="middle" fill="#9B9B79" opacity="0.5">Cami, Dueña de Ahava</text>
</svg>
